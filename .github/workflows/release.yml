name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            target: aarch64-macos
          - os: macos-latest
            platform: darwin-x64
            target: x86_64-macos
          - os: ubuntu-latest
            platform: linux-x64
            target: x86_64-linux
          - os: windows-latest
            platform: win32-x64
            target: x86_64-windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build native addon
        run: |
          cd packages/bunlet-native
          bun run build

      - name: Build CLI
        run: |
          cd packages/bunlet-cli
          bun run build

      - name: Package application
        run: |
          bun run bunlet package --${{ matrix.platform == 'darwin-arm64' || matrix.platform == 'darwin-x64' && 'mac' || matrix.platform == 'linux-x64' && 'linux' || 'win' }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: |
          bun run build

      - name: Publish bunlet
        run: cd packages/bunlet && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish bunlet-cli
        run: cd packages/bunlet-cli && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate release notes
        id: release-notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-notes.outputs.version }}
          name: Release ${{ steps.release-notes.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            release-artifacts/**/*