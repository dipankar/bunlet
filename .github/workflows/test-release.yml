name: Test Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            rust-target: aarch64-apple-darwin
          - os: macos-13
            platform: darwin-x64
            rust-target: x86_64-apple-darwin
          - os: ubuntu-latest
            platform: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: win32-x64
            rust-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: oven-sh/setup-bun@v2
      - run: echo "Building ${{ matrix.platform }}"

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Publishing"
