name: Test Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building ${{ matrix.platform }}"

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Publishing"
