[package]
name = "bunlet-cef-native"
version = "0.2.1"
edition = "2021"
description = "Native CEF (Chromium Embedded Framework) bindings using NAPI-RS — full Chromium 146+ backend for the Bunlet desktop framework"
readme = "README.md"
license = "MIT"
repository = "https://github.com/dipankar/bunlet"
homepage = "https://bunlet.dev"
keywords = ["cef", "chromium", "webview", "embedded-browser", "napi-rs"]
categories = ["gui", "web-programming"]
authors = ["Bunlet Contributors"]

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "bunlet-cef-helper"
path = "src/bin/helper.rs"

[dependencies]
# NAPI bindings for Bun/Node.js
napi = { version = "2", default-features = false, features = ["async", "serde-json", "napi9"] }
napi-derive = "2"

# CEF (Chromium Embedded Framework) bindings from Tauri team
# Pinned to =146.5 — 146.6+ broke on_pre_key_event signature
# (`*mut u8` became `Option<&mut _XEvent>`); update both pin and the
# `on_pre_key_event` impl together when bumping.
cef = "=146.5"
cef-dll-sys = "=146.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Thread-safe state
once_cell = "1"
parking_lot = "0.12"

# Standard directories
dirs-next = "2"

# URL encoding
urlencoding = "2"

# Send wrapper for !Send types
send_wrapper = "0.6"

# Logging
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
napi-build = "2"

[features]
default = []
sandbox = []

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true