[package]
name = "bunlet-cef-native"
version = "0.1.0"
edition = "2021"
description = "Native CEF bindings scaffold for Bunlet desktop framework"
license = "MIT"
repository = "https://github.com/bunlet/bunlet"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["async", "serde-json", "napi9"] }
napi-derive = "2"
tao = { version = "0.28", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
send_wrapper = "0.6"
dirs-next = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
