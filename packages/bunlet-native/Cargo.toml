[package]
name = "bunlet-native"
version = "0.2.0"
edition = "2021"
description = "Cross-platform desktop app native bindings using system WebViews and NAPI-RS — powers the Bunlet desktop framework"
readme = "README.md"
license = "MIT"
repository = "https://github.com/dipankar/bunlet"
homepage = "https://bunlet.dev"
keywords = ["webview", "desktop", "gui", "bun", "napi-rs"]
categories = ["gui", "web-programming"]
authors = ["Bunlet Contributors"]

[lib]
crate-type = ["cdylib"]

[features]
default = []
devtools = []
screen-tao-fallback = []

[dependencies]
# NAPI bindings for Bun/Node.js
napi = { version = "2", default-features = false, features = ["async", "serde-json", "napi9"] }
napi-derive = "2"

# Window management (cross-platform)
tao = { version = "0.34", features = ["serde"] }

# WebView rendering (devtools feature enables DevTools support)
wry = { version = "0.54", features = ["devtools"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

# URL encoding
urlencoding = "2"

# Simple HTTP server for serving local files
tiny_http = "0.12"

# Lazy statics
once_cell = "1"

# Thread-safe collections
parking_lot = "0.12"

# Send wrapper for GUI objects
send_wrapper = "0.6"

# Phase 2: Native APIs
rfd = "0.15"                    # File dialogs
muda = "0.17"                   # Menu system
tray-icon = "0.21"              # System tray
notify-rust = "4"               # Desktop notifications
arboard = "3"                   # Clipboard
global-hotkey = "0.8"           # Global shortcuts
dirs-next = "2"                 # Standard directories
image = "0.24"                  # Image loading for tray icons
notify = "6"                    # File system watching

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11 = { version = "2.21", features = ["xlib", "xrandr"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
